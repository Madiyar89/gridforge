<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridForge — Консоль</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  #term-wrap{background:#000;border-radius:8px;padding:8px;height:480px;}
  #term{height:100%;}
  .console-status{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);padding:0 16px 12px;}
  .console-status.live{color:var(--ok);}
  .console-status.err{color:var(--crit);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><b>GridForge</b><span>сеть · опрос · триггеры</span></div>
  <div class="topbar-right">
    <nav class="nav" id="nav"></nav>
    <span id="role-pill" class="role-pill">не авторизован</span>
    <div class="keybox">
      <input id="api-key-input" type="password" placeholder="X-API-Key">
      <button id="save-key">Войти</button>
    </div>
  </div>
</div>

<div class="page-head">
  <h1>SSH-консоль</h1>
  <p>Интерактивная сессия в браузере — свой WebSocket-мост поверх asyncssh, не Guacamole (RDP с нуля за разумное время не переписать — см. README).</p>
</div>

<div class="panel">
  <h2>Подключение</h2>
  <div class="form-row" style="border-top:none">
    <select id="c-node"><option value="">выбери узел…</option></select>
    <input id="c-user" placeholder="логин">
    <input id="c-port" type="number" value="22" style="max-width:80px">
    <input id="c-key" placeholder="путь к приватному ключу (или оставь пусто и укажи пароль)">
    <input id="c-pass" type="password" placeholder="пароль (опц.)">
    <button id="c-connect">Подключиться</button>
  </div>
  <div class="console-status" id="c-status">не подключено</div>
</div>

<div class="panel">
  <div id="term-wrap"><div id="term"></div></div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/xterm.js"></script>
<script src="common.js"></script>
<script src="console.js"></script>
</body>
</html>
